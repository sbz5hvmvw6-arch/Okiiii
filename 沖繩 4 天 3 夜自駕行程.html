h2{font-size:21px;margin:20px 0 4px;color:var(--indigo)}
h3{font-size:16px;margin:28px 0 8px}
.sub{color:var(--mute);margin:0 0 12px;font-size:14px}
.changed{border-left:4px solid var(--hib);background:var(--surface);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px;margin:12px 0}
ol.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 18px}
.tl li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--sea)}
.tl li.key::before{background:var(--hib)}
.tl time{display:block;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.tl .t{font-weight:500}
.tl .n{font-size:14px;color:var(--mute)}
a.map{display:inline-block;margin-left:8px;font-size:13px;color:var(--sea);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:0 8px}
a.map:hover{border-color:var(--sea)}
.food{list-style:none;padding:0;margin:0;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.food li{padding:9px 14px;border-bottom:1px solid var(--line);font-size:15px}
.food li:last-child{border:0}
.food b{color:var(--hib);font-weight:500;margin-right:6px}
.note{background:var(--warn);color:var(--warnink);padding:12px 14px;border-radius:8px;font-size:14px;margin-top:20px}
.chk{list-style:none;padding:0;margin:0}
.chk li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.chk input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--sea)}
.chk input:checked+span{color:var(--mute);text-decoration:line-through}
footer{max-width:720px;margin:0 auto;padding:0 20px 32px;color:var(--mute);font-size:13px}
</style>
</head>

function load(){try{return JSON.parse(localStorage.getItem("okc")||"{}")}catch(e){return{}}}
